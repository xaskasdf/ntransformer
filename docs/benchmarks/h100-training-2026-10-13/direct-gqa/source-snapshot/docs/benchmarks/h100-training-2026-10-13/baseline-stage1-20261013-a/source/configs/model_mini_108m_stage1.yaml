# Same architecture/tokenizer as the pilot. New stage resets optimizer and LR.
model:
  dim: 576
  n_layers: 30
  n_heads: 9
  n_kv_heads: 3
  vocab_size: 8192
  hidden_dim: 1472
  max_seq_len: 1024
  dropout: 0.0
  weight_tying: true
  norm_eps: 1e-5
  rope_theta: 10000.0
  block_sharing: false
  dense_former: false
  value_residual: false
  n_registers: 0
tokenizer:
  type: custom
  vocab_size: 8192
  model_path: data/tokenizer_8k.model
pretrain:
  # 2 GPUs * 16 * 2 accumulation * 1024 * 32768 = 2,147,483,648 tokens.
  max_steps: 32768
  warmup_steps: 400
  batch_size: 16
  gradient_accumulation_steps: 2
  optimizer: adamw
  learning_rate: 0.0003
  muon_learning_rate: 0.02
  min_lr_ratio: 0.1
  decay_fraction: 0.2
  weight_decay: 0.1
  grad_clip: 1.0
  eval_interval: 1000
  eval_batches: 8
  save_interval: 1000
  log_interval: 100
  seed: 20261013
finetune:
  max_steps: 1200
  warmup_steps: 100
  batch_size: 8
  gradient_accumulation_steps: 2
  optimizer: adamw
  learning_rate: 0.00005
  muon_learning_rate: 0.001
  min_lr_ratio: 0.1
  decay_fraction: 0.8
  weight_decay: 0.01
  grad_clip: 1.0
  eval_interval: 100
  eval_batches: 8
  save_interval: 100
  log_interval: 20
  seed: 20261013
